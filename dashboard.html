<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvus Lab — Dashboard</title>
<meta name="description" content="Estado y métricas de los proyectos de Corvus Lab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070e18;
  --panel:#0c1626;
  --panel-2:#0e1a2e;
  --line:rgba(88,198,208,0.14);
  --text:#e8e4dc;
  --muted:#7d8a99;
  --soft:#55626f;
  --teal:#58C6D0;
  --teal-dim:rgba(88,198,208,0.10);
  --warm:#D9A066;
  --green:#4ade80;
  --red:#f87171;
  --sans:'Inter',system-ui,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:1100px;margin:0 auto;padding:0 28px}
a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(88,198,208,.25)}
a:hover{color:#8fdfe6}

.grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.02;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.4) .4px,transparent .6px);background-size:14px 14px}
.grid-lines{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:96px 96px;mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 0%,transparent 70%);}

header{padding:64px 0 28px;position:relative;z-index:1}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.02em;margin-bottom:26px}
.brand em{font-style:italic;color:var(--teal)}
.brand a{border:0;color:var(--text)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,52px);letter-spacing:-.01em;margin-bottom:10px}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}

/* stats bar */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:36px 0 44px;position:relative;z-index:1}
.stat{background:var(--panel);padding:26px 24px}
.stat .label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:10px}
.stat .value{font-family:var(--mono);font-size:26px;font-weight:500}
.stat .value.green{color:var(--green)}
.stat .value.warm{color:var(--warm)}
.stat .value.teal{color:var(--teal)}

/* grid de sitios */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;position:relative;z-index:1;margin-bottom:60px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);padding:24px 26px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s}
.card:hover{border-color:rgba(88,198,208,.4)}
.card.down{border-color:rgba(248,113,113,.4)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{font-family:var(--serif);font-weight:500;font-size:20px}
.card h3 a{border:0;color:var(--text)}
.card h3 a:hover{color:var(--teal)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);padding:3px 8px;white-space:nowrap}
.status-line{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.5)}
.dot.down{background:var(--red);box-shadow:0 0 8px rgba(248,113,113,.5)}

.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.kpi{background:var(--teal-dim);border:1px solid rgba(88,198,208,.2);padding:10px 14px;flex:1;min-width:100px}
.kpi .k-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.kpi .k-value{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--teal)}
.kpi.warm{background:rgba(217,160,102,.08);border-color:rgba(217,160,102,.22)}
.kpi.warm .k-value{color:var(--warm)}
.kpi.plain{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07)}
.kpi.plain .k-value{color:var(--text)}

.spark{margin-top:4px;height:28px;opacity:.8}
.spark line{stroke:var(--teal);stroke-width:1.2}
.spark .base{stroke:rgba(125,138,153,.25);stroke-dasharray:2 3}

footer{border-top:1px solid var(--line);padding:30px 0 40px;position:relative;z-index:1}
footer .container{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.f-mono{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
#updated{color:var(--muted)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="grid-lines"></div>

<header>
  <div class="container">
    <p class="brand"><a href="https://corvus-lab.vercel.app">Corvus <em>Lab</em></a></p>
    <h1>Dashboard</h1>
    <p class="sub">Estado y métricas de los proyectos</p>
  </div>
</header>

<main class="container">
  <div class="stats" id="stats">
    <div class="stat"><div class="label">Sitios</div><div class="value" id="st-total">—</div></div>
    <div class="stat"><div class="label">En línea</div><div class="value green" id="st-up">—</div></div>
    <div class="stat"><div class="label">Latencia media</div><div class="value teal" id="st-lat">—</div></div>
    <div class="stat"><div class="label">Último chequeo</div><div class="value warm" id="st-time" style="font-size:13px;padding-top:6px">—</div></div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="container">
    <span class="f-mono">Corvus Lab · Observatorio de proyectos</span>
    <span class="f-mono" id="updated">—</span>
  </div>
</footer>

<script src="metrics.js"></script>
<script>
function fmtBytes(kb){ if(kb==null) return '—'; return kb < 1024 ? kb + ' KB' : (kb/1024).toFixed(1) + ' MB'; }
function fmtMs(ms){ return ms == null ? '—' : ms + ' ms'; }

function spark(history){
  const pts = (history||[]).slice(-24);
  if(pts.length < 2) return '';
  const w=120,h=28,pad=2;
  const lat = pts.map(p=>p.latency_ms==null?null:p.latency_ms).filter(v=>v!=null);
  if(lat.length<2) return '';
  const max=Math.max(...lat)*1.15||1;
  const step=w/(lat.length-1);
  const coords = lat.map((v,i)=>[pad+i*step, h-pad-(v/max)*(h-2*pad)]);
  const d = coords.map((c,i)=> (i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="base" x1="0" y1="${h-pad}" x2="${w}" y2="${h-pad}"/><path d="${d}" fill="none" stroke="#58C6D0" stroke-width="1.4" opacity="0.9"/></svg>`;
}

function fmtMetricVal(k, v){
  if(v==null) return '—';
  if(k==='inversion_usd_m') return '$'+Number(v).toLocaleString('es-AR')+' M';
  if(k==='size_kb') return fmtBytes(v);
  if(k==='latency_ms') return fmtMs(v);
  return Number(v).toLocaleString('es-AR');
}

function kpiKey(k){
  return {
    proyectos:'proyectos', inversion_usd_m:'inversión', provincias:'provincias',
    empleos:'empleos', aprobados:'aprobados', indicadores:'indicadores',
    paises:'países', firmas:'firmas', cuentos_total:'cuentos',
    cuentos_disponibles:'disponibles', libros:'libros', miembros:'miembros',
    prestados:'prestados', productos:'productos', portcos:'portcos'
  }[k] || k;
}

function render(){
  if(!window.METRICS){ document.getElementById('grid').innerHTML='<p style="color:var(--soft)">Sin datos. Corré collect_metrics.py.</p>'; return; }
  const {sites, generated_at} = window.METRICS;
  const up = sites.filter(s=>s.up).length;
  const lats = sites.map(s=>s.latency_ms).filter(v=>v!=null);
  const avg = lats.length ? Math.round(lats.reduce((a,b)=>a+b,0)/lats.length) : null;

  document.getElementById('st-total').textContent = sites.length;
  document.getElementById('st-up').textContent = up + '/' + sites.length;
  document.getElementById('st-lat').textContent = fmtMs(avg);
  const t = new Date(generated_at);
  document.getElementById('st-time').textContent = t.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  document.getElementById('updated').textContent = 'actualizado ' + t.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const grid = document.getElementById('grid');
  grid.innerHTML = sites.map(s=>{
    const mkpis = Object.entries(s.metrics||{}).filter(([k,v])=>v!==null && typeof v!=='object').map(([k,v])=>
      `<div class="kpi ${k==='inversion_usd_m'?'warm':'plain'}"><div class="k-label">${kpiKey(k)}</div><div class="k-value">${fmtMetricVal(k,v)}</div></div>`).join('');
    return `<div class="card ${s.up?'':'down'}">
      <div class="card-head">
        <h3><a href="${s.url}" target="_blank">${s.name}</a></h3>
        <span class="tag">${s.tag}</span>
      </div>
      <div class="status-line"><span class="dot ${s.up?'':'down'}"></span>${s.up?'en línea':'caído'} · ${fmtMs(s.latency_ms)} · ${fmtBytes(s.size_kb)} · HTTP ${s.status??'—'}</div>
      ${mkpis?`<div class="kpis">${mkpis}</div>`:''}
      ${spark(s.history)}
    </div>`;
  }).join('');
}

// historial embebido desde metrics_history.json
fetch('metrics_history.json').then(r=>r.json()).then(h=>{
  if(window.METRICS && h){
    window.METRICS.sites.forEach(s=>{ s.history = h[s.id]||[]; });
  }
  render();
}).catch(()=>render());

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
